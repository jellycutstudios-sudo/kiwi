<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="40%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <radialGradient id="emeraldAura" cx="50%" cy="47%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  
    <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
    <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="2" />
    

  <!-- Ambient Glow -->
  <rect width="512" height="512" fill="url(#emeraldAura)" />

  <!-- Emblem Group -->
  <g transform="translate(0, 0)">
    <!-- Platter Base -->
    <rect x="124" y="330" width="264" height="18" rx="9" fill="url(#titaniumGrad)" />
    <rect x="164" y="333" width="184" height="4" rx="2" fill="#ffffff" opacity="0.75" />

    <!-- Cloche Outer Dome Shell -->
    <path d="M 144 316 C 144 208 194 172 256 172 C 318 172 368 208 368 316 Z" fill="url(#titaniumGrad)" />

    <!-- Inner Architectural Cutout -->
    <path d="M 174 316 C 174 232 210 202 256 202 C 302 202 338 232 338 316 Z" fill="#0d0f16" />

    <!-- Cloche Stem -->
    <rect x="250" y="158" width="12" height="18" rx="4" fill="url(#titaniumGrad)" />

    <!-- Radiant Emerald Jewel Handle Crown -->
    <circle cx="256" cy="146" r="20" fill="url(#gemGrad)" filter="url(#glow)" />
    <circle cx="256" cy="146" r="20" fill="url(#gemGrad)" />
    <ellipse cx="252" cy="140" rx="7" ry="4" fill="#ffffff" opacity="0.75" />

    <!-- 4-Point Culinary Diamond Star Spark Inside Cloche -->
    <path d="M 256 236 L 263 259 L 286 266 L 263 273 L 256 296 L 249 273 L 226 266 L 249 259 Z" fill="url(#gemGrad)" />
    <circle cx="256" cy="266" r="4" fill="#ffffff" />
  </g>
</svg>
