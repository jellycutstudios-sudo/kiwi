<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d11" />
    <meta name="description" content="DineOS — Lightning-fast multi-mode restaurant POS system with table management, token system, and online orders." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DineOS" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/ricon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <title>DineOS POS</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dineos_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (saved === 'system' && window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

      // Immediate Anti-Inspect & DevTools Freeze Guard
      (function() {
        try {
          if (localStorage.getItem('dineos_disable_guards') === 'true') return;

          // 1. Block Context Menu (Right Click)
          var block = function(e) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            return false;
          };
          window.addEventListener('contextmenu', block, true);
          document.addEventListener('contextmenu', block, true);

          // 2. Block Inspection Shortcuts (F12, Cmd+Opt+I/J/C, Ctrl+Shift+I/J/C, Ctrl+U)
          var blockKeys = function(e) {
            var k = e.key ? e.key.toUpperCase() : '';
            var c = e.keyCode || e.which;
            var isCtrl = e.ctrlKey;
            var isMeta = e.metaKey;
            var isShift = e.shiftKey;
            var isAlt = e.altKey;

            if (k === 'F12' || c === 123) return block(e);
            if ((isCtrl || isMeta) && (isShift || isAlt) && (['I', 'J', 'C'].indexOf(k) !== -1 || c === 73 || c === 74 || c === 67)) return block(e);
            if ((isCtrl || isMeta) && (k === 'U' || c === 85)) return block(e);
            if ((isCtrl || isMeta) && (k === 'S' || c === 83)) return block(e);
          };
          window.addEventListener('keydown', blockKeys, true);
          document.addEventListener('keydown', blockKeys, true);

          // 3. DevTools Freeze Loop (Continuously triggers debugger to freeze inspector)
          setInterval(function() {
            try {
              (function() { Function('debugger')(); })();
            } catch (_) {}
          }, 150);
        } catch (err) {}
      })();
    </script>
    <style>
      /* Minimal Obsidian Preloader (matches #0c0d11 theme-color) */
      .dine-preloader {
        position: fixed;
        inset: 0;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0d11;
        z-index: 99999;
      }
      .dine-preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justifyContent: center;
        gap: 16px;
      }
      .dine-preloader-logo {
        width: 38px;
        height: 50px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        animation: dineBreathe 2.4s ease-in-out infinite;
      }
      .dine-preloader-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      .dine-preloader-bar {
        width: 120px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        position: relative;
      }
      .dine-preloader-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        border-radius: 999px;
        background: #ffffff;
        animation: dineGlide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes dineBreathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(0.97); }
      }
      @keyframes dineGlide {
        0% { left: -40%; }
        50% { left: 35%; }
        100% { left: 105%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="dine-preloader">
        <div class="dine-preloader-content">
          <img src="/ricon.svg" alt="DineOS" class="dine-preloader-logo" />
          <div class="dine-preloader-title">DineOS</div>
          <div class="dine-preloader-bar">
            <div class="dine-preloader-beam"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
